[package]
name = "spaghetti"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "spaghetti"
path = "src/main.rs"

[dependencies]
airplay = { path = "../airplay" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spaghetti-common = { path = "../common" }
spaghetti-engine = { path = "../engine" }
tokio = { version = "1", features = ["rt", "signal", "time", "macros"] }
