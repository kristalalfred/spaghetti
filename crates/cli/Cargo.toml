[package]
name = "spaghetti"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "spaghetti"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spaghetti-common = { path = "../common" }
tokio = { version = "1", features = ["rt", "signal", "time", "macros"] }
