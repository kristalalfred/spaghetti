[package]
name = "spaghetti-common"
version = "0.1.0"
edition.workspace = true

[features]
async-client = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "sync"], optional = true }
