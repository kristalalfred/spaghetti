[package]
name = "spaghetti-asp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
audio-server-plugin = { path = "../audio-server-plugin" }
spaghetti-common = { path = "../common" }
coreaudio-sys = { version = "0.2", features = ["core_audio", "audio_server_plugin"] }


[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation-sys = "0.8"
