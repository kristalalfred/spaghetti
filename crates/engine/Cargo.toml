[package]
name = "spaghetti-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
airplay = { path = "../airplay" }
spaghetti-common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
tracing = "0.1"
rubato = { version = "5.0.1", default-features = false }
rustfft = "6.4"
srt-tokio = "0.4.4"
bytes = "1"
futures = "0.3"
str0m = { version = "=0.24.1", default-features = false, features = ["aws-lc-rs"] }
getrandom = "0.4"
md-5 = "0.10"
hmac = "0.12"
sha1 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
uuid = { version = "1", features = ["v4", "fast-rng"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
coreaudio-sys = { version = "0.2", features = ["core_audio", "audio_toolbox"] }
core-foundation-sys = "0.8"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
opus = "0.4"
windows = { version = "0.61", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.61"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
cc = "1"
